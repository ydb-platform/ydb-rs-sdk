[package]
publish = true
name = "ydb"
version = "0.18.2"
authors = ["rekby <timofey.koolin@gmail.com>"]
edition.workspace = true
license = "Apache-2.0"
description = "Official Rust SDK for YDB - an open-source distributed SQL database"
repository = "https://github.com/ydb-platform/ydb-rs-sdk/tree/master/ydb"
homepage = "https://ydb.tech"
documentation = "https://docs.rs/ydb"
readme = "README.md"
keywords = ["ydb", "database", "sql", "client", "async"]
categories = ["database", "asynchronous", "api-bindings"]
rust-version.workspace = true

[lints]
workspace = true

[features]
force-exhaustive-all = [
] # The feature disable all non_exhaustive attributes in ydb public interface.

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
    "serde",
] }
decimal-rs = { version = "0.1", features = ["serde"] }
derivative = "2"
# version is contrained to unify darling dependency with derive_builder
bon = "<3.6"
derive_builder = "0.20"
futures-util = "0.3"
http = "1.5"
itertools = "0.14"
jsonwebtoken = "11"
time = "0.3"
num = "0.4"
once_cell = "1.8"
prost = { workspace = true }
prost-types = { workspace = true }
pbjson-types = { workspace = true }
rand = "0.9"
reqwest = { version = "0.13", features = [
    "blocking",
    "json",
], default-features = false }
secrecy = "0.4.1"
serde = { workspace = true }
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1.22", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-util = "0.7.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tonic = { workspace = true }
tower = "0.5"
url = "2.2"
uuid = { version = "1.17.0", features = ["v4", "v7"] }
ydb-grpc = { version = "0.2.2", path = "../ydb-grpc" }
flate2 = "1.1.9"
rayon = "1.10"

[dev-dependencies]
async_once = "0.2"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }
lazy_static = "1.4"
mockall = "0.14"
ntest = "0.7"
opentelemetry.workspace = true
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic"] }
opentelemetry_sdk.workspace = true
tokio = { version = "1.22", features = ["test-util"] }
tracing-opentelemetry = "0.33.0"
tracing-test = "0.2.1"
uuid = { version = "1.17.0", features = ["v4"] }
