[package]
publish = true
name = "ydb"
version = "0.18.2"
authors = ["rekby <timofey.koolin@gmail.com>"]
edition.workspace = true
license = "Apache-2.0"
description = "Official Rust SDK for YDB - an open-source distributed SQL database"
repository = "https://github.com/ydb-platform/ydb-rs-sdk/tree/master/ydb"
homepage = "https://ydb.tech"
documentation = "https://docs.rs/ydb"
readme = "README.md"
keywords = ["ydb", "database", "sql", "client", "async"]
categories = ["database", "asynchronous", "api-bindings"]
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["rustls-ring", "jwt-rust-crypto"]

# TLS crypto provider. Exactly one should be enabled: `rustls` 0.23 links
# whichever are present and picks between them at run time, so enabling both
# wastes a crypto library and leaves the choice to whatever installed a
# process default first. `ring` is the default because it is what every
# release so far has linked.
rustls-ring = ["tonic/tls-ring"]
# `tonic` spells this one without the `-rs`.
rustls-aws-lc-rs = ["tonic/tls-aws-lc"]

# Signing for `ServiceAccountCredentials`, which is the only thing in the
# crate that needs a JWT. A deployment authenticating any other way -- static
# credentials, an access token, metadata, anonymous -- links no JWT crypto at
# all with `default-features = false`.
service-account-credentials = ["dep:jsonwebtoken"]
# The backend is separate from the dependency on purpose. `jsonwebtoken` 11
# panics at the first sign when both of its backends are enabled or neither
# is, so a consumer that needs `aws-lc-rs` has to be able to say so rather
# than inherit a choice that collides with its own.
jwt-rust-crypto = ["service-account-credentials", "jsonwebtoken/rust_crypto"]
jwt-aws-lc-rs = ["service-account-credentials", "jsonwebtoken/aws_lc_rs"]

force-exhaustive-all = [
] # The feature disable all non_exhaustive attributes in ydb public interface.

[dependencies]
async-trait = { workspace = true }
bon = { workspace = true }
chrono = { workspace = true }
decimal-rs = { workspace = true }
derivative = { workspace = true }
derive_builder = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
itertools = { workspace = true }
jsonwebtoken = { workspace = true, optional = true }
metrics = { workspace = true }
num = { workspace = true }
once_cell = { workspace = true }
pbjson-types = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
ydb-grpc = { workspace = true }

[dev-dependencies]
metrics-prometheus = { workspace = true }
mockall = { workspace = true }
ntest = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { workspace = true }
prometheus = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-opentelemetry = { workspace = true }
tracing-test = { workspace = true }

# Needs `ServiceAccountCredentials`, which the default features carry and
# `--no-default-features` does not.
[[example]]
name = "auth-ycloud-serviceaccount"
required-features = ["service-account-credentials"]
