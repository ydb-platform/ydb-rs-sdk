[package]
publish = true
name = "ydb"
version = "0.18.2"
authors = ["rekby <timofey.koolin@gmail.com>"]
edition.workspace = true
license = "Apache-2.0"
description = "Official Rust SDK for YDB - an open-source distributed SQL database"
repository = "https://github.com/ydb-platform/ydb-rs-sdk/tree/master/ydb"
homepage = "https://ydb.tech"
documentation = "https://docs.rs/ydb"
readme = "README.md"
keywords = ["ydb", "database", "sql", "client", "async"]
categories = ["database", "asynchronous", "api-bindings"]
rust-version.workspace = true

[lints]
workspace = true

[features]
force-exhaustive-all = [
] # The feature disable all non_exhaustive attributes in ydb public interface.

[dependencies]
async-trait = { workspace = true }
bon = { workspace = true }
chrono = { workspace = true }
decimal-rs = { workspace = true }
derivative = { workspace = true }
derive_builder = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
itertools = { workspace = true }
jsonwebtoken = { workspace = true }
metrics = { workspace = true }
num = { workspace = true }
once_cell = { workspace = true }
pbjson-types = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
ydb-grpc = { workspace = true }

[dev-dependencies]
async_once = { workspace = true }
lazy_static = { workspace = true }
metrics-prometheus = { workspace = true }
mockall = { workspace = true }
ntest = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
prometheus = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-opentelemetry = { workspace = true }
tracing-test = { workspace = true }
