[package]
publish = false
name = "slo-framework"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
hdrhistogram = { workspace = true }
opentelemetry = { workspace = true }
# `reqwest-rustls` would pull `aws-lc-rs`; the exporter gets a preconfigured
# client instead, see `metrics::metric_exporter`.
opentelemetry-otlp = { workspace = true, features = [
    "http-proto",
    "metrics",
    "reqwest-client",
] }
opentelemetry-semantic-conventions = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"] }
rand = { workspace = true }
rand_core = { workspace = true }
reqwest = { workspace = true, features = ["http2"] }
# The workload prefers `ring`; it is the only provider enabled in the binary, so
# rustls picks it as the implicit default.
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tokio-util = { workspace = true }
ydb = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
