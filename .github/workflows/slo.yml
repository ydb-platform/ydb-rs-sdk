name: SLO

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches:
      - master
      - release-*
  workflow_dispatch:
    inputs:
      github_issue:
        description: "Optional issue or pull request number for the SLO report comment"
        required: false
      baseline_ref:
        description: "Baseline commit/branch/tag to compare against (leave empty to auto-detect merge-base with main)"
        required: false
      runner_label:
        description: "Runner label for this manual run"
        type: choice
        options: ["large-runner-rs-sdk", "ubuntu-latest"]
        default: "large-runner-rs-sdk"
      slo_workload_duration_seconds:
        description: "Duration of the SLO workload in seconds"
        required: false
        default: "600"
      slo_workload_read_max_rps:
        description: "Maximum read RPS for the SLO workload"
        required: false
        default: "1000"
      slo_workload_write_max_rps:
        description: "Maximum write RPS for the SLO workload"
        required: false
        default: "100"

jobs:
  ydb-slo-action:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'SLO')

    name: Run YDB SLO Tests
    runs-on: ${{ inputs.runner_label || 'large-runner-rs-sdk' }}

    strategy:
      fail-fast: false
      matrix:
        sdk:
          - name: native-query
            path: native/query
            workload_type: table
          - name: native-topic
            path: native/topic
            workload_type: topic
            metrics_yaml_path: current/tests/slo/metrics-topic.yaml
          - name: native-topic-tx
            path: native/topic-tx
            workload_type: topic_tx
            metrics_yaml_path: current/tests/slo/metrics-topic-tx.yaml
            thresholds_yaml_path: current/tests/slo/thresholds-topic-tx.yaml

    concurrency:
      group: slo-${{ github.ref }}-${{ matrix.sdk.name }}
      cancel-in-progress: true

    steps:
      - name: Install dependencies
        run: |
          YQ_VERSION=v4.48.2
          BUILDX_VERSION=0.30.1
          COMPOSE_VERSION=2.40.3

          sudo curl -L https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64 -o /usr/local/bin/yq && \
            sudo chmod +x /usr/local/bin/yq

          echo "Updating Docker plugins..."
          sudo mkdir -p /usr/local/lib/docker/cli-plugins

          echo "Installing Docker Buildx ${BUILDX_VERSION}..."
          sudo curl -fLo /usr/local/lib/docker/cli-plugins/docker-buildx \
            "https://github.com/docker/buildx/releases/download/v${BUILDX_VERSION}/buildx-v${BUILDX_VERSION}.linux-amd64"
          sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx

          echo "Installing Docker Compose ${COMPOSE_VERSION}..."
          sudo curl -fLo /usr/local/lib/docker/cli-plugins/docker-compose \
            "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          echo "Installed versions:"
          yq --version
          docker --version
          docker buildx version
          docker compose version

      - name: Checkout current version
        uses: actions/checkout@v5
        with:
          path: current
          fetch-depth: 0
          submodules: true

      - name: Determine baseline commit
        id: baseline
        run: |
          cd current
          if [[ -n "${{ inputs.baseline_ref }}" ]]; then
            BASELINE="${{ inputs.baseline_ref }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BASELINE="${{ github.event.before }}"
          else
            BASELINE=$(git merge-base HEAD origin/master)
          fi
          echo "sha=$BASELINE" >> $GITHUB_OUTPUT

          if git merge-base --is-ancestor $BASELINE origin/master && \
             [ "$(git rev-parse origin/master)" = "$BASELINE" ]; then
            BASELINE_REF="master"
          else
            BRANCH=$(git branch -r --contains $BASELINE | grep -v HEAD | head -1 | sed 's/.*\///' || echo "")
            if [ -n "$BRANCH" ]; then
              BASELINE_REF="${BRANCH}@${BASELINE:0:7}"
            else
              BASELINE_REF="${BASELINE:0:7}"
            fi
          fi
          echo "ref=$BASELINE_REF" >> $GITHUB_OUTPUT

      - name: Checkout baseline version
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.baseline.outputs.sha }}
          path: baseline
          fetch-depth: 1
          submodules: true

      - name: Check baseline workload availability
        id: baseline-workload
        run: |
          if [[ "${{ matrix.sdk.workload_type }}" == "table" ]]; then
            # Share the Table checker, not the SDK sources or built image.
            rm -rf "$GITHUB_WORKSPACE/baseline/tests/slo/${{ matrix.sdk.path }}"
            mkdir -p "$(dirname "$GITHUB_WORKSPACE/baseline/tests/slo/${{ matrix.sdk.path }}")"
            cp -a "$GITHUB_WORKSPACE/current/tests/slo/${{ matrix.sdk.path }}" \
              "$GITHUB_WORKSPACE/baseline/tests/slo/${{ matrix.sdk.path }}"
          fi
          if [[ -f "$GITHUB_WORKSPACE/baseline/tests/slo/${{ matrix.sdk.path }}/Cargo.toml" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build current workload image
        run: |
          SCRIPT="$GITHUB_WORKSPACE/current/.github/scripts/build-slo-image.sh"
          chmod +x "$SCRIPT"

          bash "$SCRIPT" \
            --context "$GITHUB_WORKSPACE/current" \
            --tag "ydb-app-current" \
            --src-path "${{ matrix.sdk.path }}"

      - name: Build baseline workload image
        if: steps.baseline-workload.outputs.available == 'true'
        run: |
          SCRIPT="$GITHUB_WORKSPACE/current/.github/scripts/build-slo-image.sh"

          # slo-framework is shared by all workloads; keep it in sync with current
          # so baseline images pick up framework fixes (e.g. OTLP client features).
          rm -rf "$GITHUB_WORKSPACE/baseline/tests/slo/slo-framework"
          cp -r "$GITHUB_WORKSPACE/current/tests/slo/slo-framework" \
            "$GITHUB_WORKSPACE/baseline/tests/slo/slo-framework"

          bash "$SCRIPT" \
            --context "$GITHUB_WORKSPACE/baseline" \
            --tag "ydb-app-baseline" \
            --src-path "${{ matrix.sdk.path }}"

      - name: Run SLO Tests
        # Pin legacy telemetry fixes until ydb-slo-action#81 is merged.
        uses: ydb-platform/ydb-slo-action/init@d66bd1e10f893e5f70d542c4430a3cffb6d6f9f8
        timeout-minutes: 30
        with:
          github_issue: ${{ github.event.inputs.github_issue }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workload_name: ${{ matrix.sdk.name }}
          workload_duration: ${{ inputs.slo_workload_duration_seconds || '600' }}
          fail_on_workload_error: "true"
          workload_current_ref: ${{ github.head_ref || github.ref_name }}
          workload_current_image: ydb-app-current
          workload_baseline_ref: ${{ steps.baseline-workload.outputs.available == 'true' && steps.baseline.outputs.ref || '' }}
          workload_baseline_image: ${{ steps.baseline-workload.outputs.available == 'true' && 'ydb-app-baseline' || '' }}
          workload_type: ${{ matrix.sdk.workload_type }}
          metrics_yaml_path: ${{ matrix.sdk.metrics_yaml_path }}
          thresholds_yaml_path: ${{ matrix.sdk.thresholds_yaml_path }}
          disable_compose_profiles: ${{ steps.baseline-workload.outputs.available != 'true' && 'workload-baseline' || '' }}
