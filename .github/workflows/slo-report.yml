name: slo-report

on:
  workflow_run:
    workflows: ["SLO"]
    types: [completed]

jobs:
  publish-slo-report:
    runs-on: ubuntu-latest
    name: Publish YDB SLO Report
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Publish YDB SLO Report
        uses: ydb-platform/ydb-slo-action/report@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_run_id: ${{ github.event.workflow_run.id }}
          remove_label: ${{ github.event.workflow_run.event == 'pull_request' && 'SLO' || '' }}
