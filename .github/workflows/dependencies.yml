name: Dependencies

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Advisories are published against the committed Cargo.lock, so the check
    # has to run without a push to be of any use.
    - cron: '43 4 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # Pinned modern Rust version, kept in sync with the other workflows.
  RUST_VERSION_MODERN: "1.96"

jobs:
  workspace-dependencies:
    name: Workspace dependency inheritance
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check that members inherit [workspace.dependencies]
        run: python3 .github/scripts/check_workspace_deps.py

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION_MODERN }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      # The graph a user of the `ydb` / `ydb-grpc` crates actually compiles:
      # no dev-dependencies, no `publish = false` SLO workloads. A second
      # version of any crate in it fails the build, see deny.toml.
      - name: Published dependency graph
        run: |
          cargo deny --locked --all-features --exclude-unpublished --exclude-dev \
            check bans licenses sources -D unmatched-skip -D unnecessary-skip

      # `rustls-ring` and `rustls-aws-lc-rs` are alternatives, and so are the
      # `jwt-*` backends: a build links one crypto library, not both. The check
      # above runs on the union of all features, where both are present, so this
      # is what keeps each real build to one. `cargo tree -i` prints nothing when
      # the package is not in the graph.
      - name: One crypto provider per build
        run: |
          ring=$(cargo tree --locked -p ydb -e normal -i ring 2>/dev/null)
          test -n "$ring" || { echo "default build no longer links ring"; exit 1; }
          aws=$(cargo tree --locked -p ydb -e normal -i aws-lc-rs 2>/dev/null)
          test -z "$aws" || { echo "default build links aws-lc-rs:"; echo "$aws"; exit 1; }
          ring=$(cargo tree --locked -p ydb --no-default-features \
            --features rustls-aws-lc-rs,jwt-aws-lc-rs -e normal -i ring 2>/dev/null)
          test -z "$ring" || { echo "aws-lc-rs build links ring:"; echo "$ring"; exit 1; }

      # Advisories cover everything that is built in this repository, including
      # dev-dependencies and the SLO workloads.
      - name: Security advisories
        run: cargo deny --locked --all-features check advisories
