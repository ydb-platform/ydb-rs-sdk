[workspace]
resolver = "2"
members = [
    "ydb",
    "ydb-grpc",
    #    "ydb-grpc-helpers",
    "tests/slo/slo-framework",
    "tests/slo/native/query",
    "tests/slo/native/topic",
    "tests/slo/native/topic-tx",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
incompatible_msrv = "warn"

[workspace.dependencies]
# Versions of those crates should match, that's why all of them are here.
prost = "0.14.1"
prost-types = "0.14.1"
prost-build = "0.14.1"

# Versions of those crates should match, that's why all of them are here.
pbjson = "0.8.0"
pbjson-types = "0.8.0"
pbjson-build = "0.8.0"

# Versions of those crates should match, that's why all of them are here.
tonic = { version = "0.14.2", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14.2"
tonic-prost-build = "0.14.2"

serde = { version = "1.0", features = ["derive"] }

opentelemetry = "0.32.0"
opentelemetry-otlp = "0.32.0"
opentelemetry_sdk = "0.32.1"
opentelemetry-semantic-conventions = "0.32"

[patch.crates-io]
opentelemetry = { version = "0.32.0", git = "https://github.com/open-telemetry/opentelemetry-rust.git", rev = "efc4ef4acd17919751674cf1ef9505e4f050de59" }
opentelemetry-otlp = { version = "0.32.0", features = [
    "grpc-tonic",
], git = "https://github.com/open-telemetry/opentelemetry-rust.git", rev = "efc4ef4acd17919751674cf1ef9505e4f050de59" }
opentelemetry_sdk = { version = "0.32.1", git = "https://github.com/open-telemetry/opentelemetry-rust.git", rev = "efc4ef4acd17919751674cf1ef9505e4f050de59" }
opentelemetry-semantic-conventions = { version = "0.32", git = "https://github.com/open-telemetry/opentelemetry-rust.git", rev = "efc4ef4acd17919751674cf1ef9505e4f050de59" }
