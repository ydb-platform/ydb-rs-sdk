[workspace]
resolver = "2"
members = [
    "ydb",
    "ydb-grpc",
    #    "ydb-grpc-helpers",
    "tests/slo/slo-framework",
    "tests/slo/native/query",
    "tests/slo/native/topic",
    "tests/slo/native/topic-tx",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
incompatible_msrv = "warn"

# Every third-party dependency of every workspace member is declared here and
# inherited with `{ workspace = true }`. A version requirement must not appear in
# a member manifest: one requirement per crate is what keeps a single version of
# it in the dependency tree. `deny.toml` turns that into an enforced rule and CI
# runs both checks, see `.github/workflows/dependencies.yml`.

[workspace.dependencies]
# Workspace members.
slo-framework = { path = "tests/slo/slo-framework" }
ydb = { path = "ydb" }
ydb-grpc = { version = "0.2.2", path = "ydb-grpc" }

# Protobuf and gRPC stack. Versions inside each family must match, and `prost`
# must match the `prost` that `tonic-prost` and `pbjson` are built against.
pbjson = "0.8.0"
pbjson-build = "0.8.0"
pbjson-types = "0.8.0"
prost = "0.14.1"
prost-build = "0.14.1"
prost-types = "0.14.1"
tonic = { version = "0.14.2", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14.2"
tonic-prost-build = "0.14.2"

# Runtime and I/O.
futures-util = "0.3"
tokio = { version = "1.38", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-util = "0.7.11"
tower = "0.5"

# HTTP. `reqwest` must stay on the `hyper` 1.x / `http` 1.x / `rustls` 0.23
# generation used by `tonic`, and on the `ring` crypto provider: `rustls` 0.23
# fails at runtime when several providers are linked without an explicit choice.
http = "1.1.0"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }

# Serialization and data types.
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
    "serde",
] }
decimal-rs = { version = "0.1", features = ["serde"] }
flate2 = "1.1.9"
num = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = "0.3"
url = "2.2"
uuid = { version = "1.17.0", features = ["v4", "v7"] }

# Derive macros and general utilities.
async-trait = "0.1"
bon = "3"
derivative = "2"
derive_builder = "0.20"
itertools = "0.14"
once_cell = "1.8"
rand = "0.8"
rayon = "1.10"
secrecy = "0.4.1"
strum = { version = "0.27", features = ["derive"] }
walkdir = "2"

# Authentication.
jsonwebtoken = "9.3"

# Observability.
metrics = "0.24.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Test-only dependencies of the `ydb` crate.
async_once = "0.2"
lazy_static = "1.4"
metrics-prometheus = "0.11.2"
mockall = "0.14"
ntest = "0.7"
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic"] }
opentelemetry_sdk = "0.32.1"
prometheus = "0.14.0"
tracing-opentelemetry = "0.33.0"
tracing-test = "0.2.1"

# SLO workload only. These crates are not part of the published dependency
# tree: the SLO binaries are `publish = false`, and CI excludes them from the
# single-version check with `--exclude-unpublished`.
anyhow = "1"
base64 = "0.22.1"
clap = { version = "4.5", features = ["derive"] }
hdrhistogram = "7.5.4"
rand_core = "0.6.4"
